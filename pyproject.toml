[project]
name = "napari-confeta"
dynamic = ["version"]
description = "A configurable features table widget for Napari."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mallory Wittwer", email = "mallory.wittwer@epfl.ch" }]

classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "napari[all]>=0.4.16",
    "qtpy",
    "magicgui",
    "numpy",
    "pandas",
    "scikit-image",
    "napari-toolkit",
    "matplotlib",
    "numba",
    "pillow>=13.0.0",
    "urllib3>=2.7.0",
]

[project.entry-points."napari.manifest"]
napari_confeta = "napari_confeta:napari.yaml"

[project.urls]
homepage = "https://github.com/EPFL-Center-for-Imaging/napari-confeta"
repository = "https://github.com/EPFL-Center-for-Imaging/napari-confeta"

[build-system]
requires = ["setuptools>=42.0.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.setuptools_scm]
write_to = "src/napari_confeta/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
